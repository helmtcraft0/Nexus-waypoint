name: Build Nexus Waypoints Levi Packs

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 unzip

      - name: Locate or extract Nexus Waypoints source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ARCHIVE=""

          for candidate in \
            "$GITHUB_WORKSPACE/NexusWaypoints_SOURCE_FIXED.zip" \
            "$GITHUB_WORKSPACE/NexusWaypoints_SOURCE.zip"; do
            if [[ -f "$candidate" ]]; then
              SOURCE_ARCHIVE="$candidate"
              break
            fi
          done

          if [[ -z "$SOURCE_ARCHIVE" ]]; then
            shopt -s nullglob
            for candidate in "$GITHUB_WORKSPACE"/NexusWaypoints_SOURCE*.zip; do
              if [[ -f "$candidate" ]]; then
                SOURCE_ARCHIVE="$candidate"
                break
              fi
            done
            shopt -u nullglob
          fi

          if [[ -n "$SOURCE_ARCHIVE" ]]; then
            echo "Found: $(basename "$SOURCE_ARCHIVE")"

            rm -rf "$GITHUB_WORKSPACE/_nexus_source"
            mkdir -p "$GITHUB_WORKSPACE/_nexus_source"

            unzip -q "$SOURCE_ARCHIVE" \
              -d "$GITHUB_WORKSPACE/_nexus_source"

            SEARCH_ROOT="$GITHUB_WORKSPACE/_nexus_source"
          else
            SEARCH_ROOT="$GITHUB_WORKSPACE"
          fi

          CMAKE_FILE="$(find "$SEARCH_ROOT" \
            -type f -name CMakeLists.txt \
            -not -path '*/.git/*' \
            -not -path '*/build-nexus/*' \
            -print -quit)"

          if [[ -z "$CMAKE_FILE" ]]; then
            echo "::error::CMakeLists.txt was not found."
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f \
              -not -path '*/.git/*' | sort | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$CMAKE_FILE")"

          REQUIRED_FILES=(
            "CMakeLists.txt"
            "manifest.json"
            "icon.png"
            "src/NexusWaypoints.cpp"
            "src/WaypointMath.hpp"
            "scripts/package.py"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$PROJECT_DIR/$file" ]]; then
              echo "::error::Missing file: $PROJECT_DIR/$file"
              exit 1
            fi
          done

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using source: $PROJECT_DIR"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android NDK r28c
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;28.2.13676358'
          test -f "$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake"

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build compatible BedrockTools runtime
        shell: bash
        run: |
          set -euo pipefail

          git clone https://github.com/QYCottage/BedrockTools.git \
            "$RUNNER_TEMP/BedrockTools"

          cd "$RUNNER_TEMP/BedrockTools"

          git checkout 81176f287453b68c131a34f78b198355675bd7b6

          xmake f -y -p android -a arm64-v8a -m release \
            --ndk="$ANDROID_HOME/ndk/28.2.13676358"

          xmake -y

          BT_PACK="$(find build -type f \
            -name 'BedrockTools.levipack' -print -quit)"

          if [[ -z "$BT_PACK" ]]; then
            echo "::error::BedrockTools.levipack was not produced."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist/dependencies"

          cp "$BT_PACK" \
            "$GITHUB_WORKSPACE/dist/dependencies/BedrockTools_1.26.60_ARM64.levipack"

          python3 - "$BT_PACK" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              bad_file = archive.testzip()

              if bad_file:
                  raise SystemExit(f"Invalid ZIP member: {bad_file}")

              if not any(
                  name.endswith("libBedrockTools.so")
                  for name in archive.namelist()
              ):
                  raise SystemExit("BedrockTools library not found")

          print("BedrockTools package validated.")
          PY

      - name: Configure Nexus Waypoints ARM64 build
        shell: bash
        run: |
          set -euo pipefail

          cmake -S "$PROJECT_DIR" \
            -B "$GITHUB_WORKSPACE/build-nexus" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile Nexus Waypoints native mod
        run: |
          cmake --build "$GITHUB_WORKSPACE/build-nexus" --parallel 2

      - name: Package and validate Nexus Waypoints Levi Pack
        shell: bash
        run: |
          set -euo pipefail

          LIBRARY="$GITHUB_WORKSPACE/build-nexus/out/arm64-v8a/libnexus_waypoints.so"

          if [[ ! -f "$LIBRARY" ]]; then
            echo "::error::Native library was not created."
            find "$GITHUB_WORKSPACE/build-nexus" -type f | sort | tail -100
            exit 1
          fi

          python3 "$PROJECT_DIR/scripts/package.py" \
            --project "$PROJECT_DIR" \
            --library "$LIBRARY" \
            --output "$GITHUB_WORKSPACE/dist/NexusWaypoints_1.0.0_ARM64.levipack"

          unzip -t "$GITHUB_WORKSPACE/dist/NexusWaypoints_1.0.0_ARM64.levipack"

      - name: Upload both Levi Packs
        uses: actions/upload-artifact@v4
        with:
          name: NexusWaypoints-1.0.0-and-runtime-ARM64
          path: dist/
          if-no-files-found: error
          retention-days: 14
